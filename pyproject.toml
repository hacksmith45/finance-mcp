[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-expense-management-mcp-server"
version = "0.1.0"
description = "An MCP server for invoice, expense, and financial report management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "pydantic[email]>=2.7,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
finance-mcp = "finance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_mcp"]
